<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screener</title>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #121212; --panel: #1b1b1b; --line: #2c2c2c; --text: #d8d8d8; --muted: #8a8a8a;
    --up: #26a69a; --down: #ef5350; --sel: #26324a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 "Segoe UI", Roboto, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .badge { padding: 1px 7px; border-radius: 3px; font-size: 11px; background: #333; color: #ccc; }
  .badge.demo { background: #5a4500; color: #ffd666; }
  .badge.open { background: #0f3d36; color: #5fd3c3; }
  #status { color: var(--muted); font-size: 12px; margin-left: auto; }
  .badge.ext { background: #2d2a4a; color: #b9b0ff; }
  .badge.token-ok { background: #1e2b1e; color: #8fcf8f; }
  .badge.token-warning { background: #5a4500; color: #ffd666; }
  .badge.token-urgent, .badge.token-expired, .badge.token-missing { background: #6b1414; color: #ffd0d0; }
  #errors { color: #ff9b8f; font-size: 12px; padding: 0 14px; }
  #token-banner { display: none; padding: 7px 14px; font-size: 13px; border-bottom: 1px solid var(--line); }
  #token-banner.warning { display: block; background: #3d3000; color: #ffd666; }
  #token-banner.urgent, #token-banner.expired, #token-banner.missing { display: block; background: #5c1010; color: #fff; font-weight: 600; }
  #token-banner code { background: rgba(0,0,0,.35); padding: 1px 5px; border-radius: 3px; }
  body { display: flex; flex-direction: column; height: 100vh; }
  main { display: grid; grid-template-columns: minmax(560px, 680px) 1fr; gap: 12px; padding: 12px 14px; flex: 1; min-height: 0; }
  .left { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .box { background: var(--panel); border: 1px solid var(--line); }

  /* Section A: Top Scans (thinkorswim style) */
  .scans-head { display: flex; align-items: center; gap: 8px; padding: 5px 8px; font-weight: 600; border-bottom: 1px solid var(--line); background: #202020; }
  #scan-clear { margin-left: auto; padding: 1px 8px; font-weight: 500; }
  #scan-clear[hidden] { display: none; }
  .watchlist, .add-ticker { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .add-ticker { border-bottom: 0; }
  .watchlist input[type="file"] { display: none; }
  label.file-btn { background: #2a2a2a; color: var(--text); border: 1px solid #444; padding: 3px 10px; border-radius: 3px; cursor: pointer; }
  .add-ticker input { flex: 1; min-width: 0; background: #0b0b0b; color: var(--text); border: 1px solid #555; border-radius: 3px; padding: 5px 8px; font: inherit; }
  .add-ticker input:focus { outline: none; border-color: #888; }
  .watch-note { color: var(--muted); font-size: 11px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.scan { display: grid; grid-template-columns: 1fr 120px; align-items: center; width: 100%; text-align: left; padding: 6px 8px; border: 0; border-bottom: 1px solid #000; border-radius: 0; background: transparent; color: inherit; }
  button.scan:hover { background: #242424; }
  button.scan.total { background: #3a3a3a; }
  button.scan.active { background: #26324a; }
  .scan .num { text-align: center; font-variant-numeric: tabular-nums; }
  .bar { height: 7px; background: #0b0b0b; border: 1px solid #555; margin-top: 2px; }
  .bar > i { display: block; height: 100%; background: #9a9a9a; width: 0; transition: width .4s; }
  .scan.total .bar > i { background: #c8c8c8; }

  /* Section B: table */
  .table-wrap { overflow: auto; min-height: 0; flex: 1; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid #222; }
  th:first-child, td:first-child { text-align: left; }
  th { position: sticky; top: 0; background: #202020; color: #bbb; font-weight: 600; cursor: pointer; user-select: none; }
  th:hover { color: #fff; }
  th .arrow { color: var(--muted); font-size: 10px; margin-left: 3px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #1f1f1f; }
  tbody tr.selected { background: var(--sel); }
  td.sym { font-weight: 600; }
  td.sym small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .pos { color: var(--up); }
  .neg { color: var(--down); }
  .hot { color: #ffd666; font-weight: 600; }
  td.ext { color: #b9b0ff; }

  /* Section C: chart */
  .chart-box { display: flex; flex-direction: column; min-height: 0; }
  .chart-head { display: flex; align-items: center; gap: 12px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .chart-head b { font-size: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--muted); }
  .ma { display: inline-flex; align-items: center; gap: 4px; }
  .ma-vis { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; }
  .ma-vis i { width: 12px; height: 2px; background: currentColor; display: inline-block; }
  .ma.off .ma-vis { opacity: 0.35; text-decoration: line-through; }
  .ma input { width: 46px; background: #111; color: var(--text); border: 1px solid #444; border-radius: 3px; padding: 2px 4px; font: inherit; }
  .ma-type { padding: 2px 6px; min-width: 42px; }
  #ohlc { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  button { background: #2a2a2a; color: var(--text); border: 1px solid #444; padding: 3px 10px; border-radius: 3px; cursor: pointer; font: inherit; }
  .chart-actions { margin-left: auto; display: flex; gap: 8px; }
  #bw[aria-pressed="true"] { background: #3a3a3a; border-color: #c8c8c8; color: #fff; }
  #chart { flex: 1; min-height: 360px; position: relative; }
  #chart-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); pointer-events: none; z-index: 2; }

  @media (max-width: 980px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; height: auto; }
    .table-wrap { max-height: 60vh; }
    #chart { height: 520px; }
  }
</style>
</head>
<body>
<header>
  <h1>Screener</h1>
  <span id="mode" class="badge"></span>
  <span id="market" class="badge"></span>
  <span id="token" class="badge" style="display:none"></span>
  <span id="status">Loading…</span>
</header>
<div id="token-banner"></div>
<div id="errors"></div>
<main>
  <div class="left">
    <section class="box" id="scans">
      <div class="scans-head">
        <span>Top Scans ▾</span>
        <button type="button" id="scan-clear" hidden>Show all</button>
      </div>
      <div class="watchlist">
        <label class="file-btn">Upload<input id="watchlist-file" type="file" accept=".txt,.csv,text/plain,text/csv" aria-label="Watchlist file"></label>
        <button type="button" id="watchlist-replace" title="Replace the universe with this file">Replace</button>
        <button type="button" id="watchlist-merge" title="Add this file to the universe">Merge</button>
        <span id="watchlist-note" class="watch-note"></span>
      </div>
      <div id="scan-rows"></div>
    </section>
    <section class="box table-wrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
    <form id="add-ticker" class="box add-ticker">
      <input id="add-symbol" type="text" maxlength="12" placeholder="Add ticker" autocomplete="off" spellcheck="false" aria-label="Add ticker">
      <button type="submit">Add</button>
      <span id="add-note" class="watch-note"></span>
    </form>
  </div>
  <section class="box chart-box">
    <div class="chart-head">
      <b id="chart-symbol">—</b>
      <div class="legend" id="legend"></div>
      <span id="ohlc"></span>
      <div class="chart-actions">
        <button type="button" id="bw" aria-pressed="false" title="Hollow up candles and filled down candles">B&amp;W</button>
        <button type="button" id="theme">Dark mode</button>
      </div>
    </div>
    <div id="chart"><div id="chart-msg">Click a row to chart it</div></div>
  </section>
</main>
<script>
const POLL_MS = 5000;
const SCANS = [
  ["universe_count", "my universe", true],
  ["gapped_up", "gapped-up"],
  ["positive_since_close", "+ve since last close"],
  ["moved_up_since_open", "moved up since open"],
  ["topd_moved_up_since_open", "topd moved up since open"],
];
const COLUMNS = [
  { key: "symbol", label: "Ticker" },
  { key: "price", label: "Price" },
  { key: "pct_from_open", label: "% From Open" },
  { key: "pct_from_close", label: "% Day" },
  { key: "volume", label: "Volume" },
  { key: "rvol", label: "20D RVOL" },
  { key: "rvol_pace", label: "Paced RVOL", title: "volume / (20-day avg volume × share of session elapsed)" },
];
const SESSION_LABELS = { regular: "Market open", pre: "Pre-market", post: "After hours", closed: "Market closed" };
const THEMES = {
  light: { background: "#ffffff", text: "#333333", grid: "#eeeeee", border: "#d6d6d6" },
  dark: { background: "#121212", text: "#cccccc", grid: "#1f1f1f", border: "#333333" },
};

const DEFAULT_MAS = [
  { period: 10, type: "EMA", color: "#ef5350", visible: true },
  { period: 20, type: "EMA", color: "#2962ff", visible: true },
  { period: 50, type: "SMA", color: "#2e9d4f", visible: true },
  { period: 200, type: "SMA", color: "#9e9e9e", visible: true },
];

function loadMas() {
  try {
    const saved = JSON.parse(localStorage.getItem("screener.mas") || "null");
    if (!Array.isArray(saved) || saved.length !== DEFAULT_MAS.length) return DEFAULT_MAS.map((item) => ({ ...item }));
    return DEFAULT_MAS.map((item, index) => {
      const period = Number(saved[index].period);
      const type = saved[index].type === "SMA" ? "SMA" : "EMA";
      return {
        period: Number.isInteger(period) && period >= 1 && period <= 500 ? period : item.period,
        type,
        color: item.color,
        visible: saved[index].visible !== false,
      };
    });
  } catch (err) {
    return DEFAULT_MAS.map((item) => ({ ...item }));
  }
}

const state = {
  sort: JSON.parse(localStorage.getItem("screener.sort") || "null") || { key: "pct_from_close", dir: "desc" },
  selected: localStorage.getItem("screener.symbol"),
  theme: localStorage.getItem("screener.theme") || "light",
  bw: localStorage.getItem("screener.bw") === "1",
  scan: null,
  mas: loadMas(),
  data: null,
  chartBars: null,
  chartVolume: null,
};

const $ = (id) => document.getElementById(id);

function fmtVolume(v) {
  if (v == null) return "—";
  if (v >= 1e9) return (v / 1e9).toFixed(2) + "B";
  if (v >= 1e6) return (v / 1e6).toFixed(2) + "M";
  if (v >= 1e3) return Math.round(v / 1e3) + "K";
  return String(v);
}
const fmtPrice = (v) => (v == null ? "—" : v.toFixed(2));
const fmtRatio = (v) => (v == null ? "—" : v.toFixed(2));
const fmtPct = (v) => (v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%");
const signClass = (v) => (v == null || v === 0 ? "" : v > 0 ? "pos" : "neg");

function renderScans(summary) {
  const total = summary.universe_count || 0;
  $("scan-clear").hidden = !state.scan;
  $("scan-rows").innerHTML = SCANS.map(([key, label, isTotal]) => {
    const count = summary[key] ?? 0;
    const width = total ? (count / total) * 100 : 0;
    const active = !isTotal && state.scan === key;
    return `<button type="button" class="scan${isTotal ? " total" : ""}${active ? " active" : ""}" data-scan="${isTotal ? "" : key}" aria-pressed="${active}">
      <span>${label}</span>
      <div><div class="num">${count}</div><div class="bar"><i style="width:${width}%"></i></div></div>
    </button>`;
  }).join("");
}

function setScan(key) {
  state.scan = key && state.scan !== key ? key : null;
  if (!state.data) return;
  renderScans(state.data.summary);
  renderTable();
}

function renderHead() {
  $("head").innerHTML = COLUMNS.map((c) => {
    const arrow = state.sort.key === c.key ? (state.sort.dir === "desc" ? "▼" : "▲") : "";
    return `<th data-key="${c.key}"${c.title ? ` title="${c.title}"` : ""}>${c.label}<span class="arrow">${arrow}</span></th>`;
  }).join("");
}

function sortedStocks(stocks) {
  const { key, dir } = state.sort;
  const mult = dir === "desc" ? -1 : 1;
  return [...stocks].sort((a, b) => {
    const x = a[key], y = b[key];
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * mult;
  });
}

function visibleStocks(stocks) {
  if (!state.scan || !state.data) return stocks;
  const members = new Set((state.data.summary.scans || {})[state.scan] || []);
  return stocks.filter((s) => members.has(s.symbol));
}

function renderTable() {
  const { stocks, meta } = state.data;
  const hotRvol = meta.thresholds.topd_min_rvol;
  $("rows").innerHTML = sortedStocks(visibleStocks(stocks)).map((s) => `
    <tr data-symbol="${s.symbol}" class="${s.symbol === state.selected ? "selected" : ""}">
      <td class="sym">${s.symbol}${s.group ? `<small>${s.group}</small>` : ""}</td>
      <td${s.extended_hours ? ` class="ext" title="Extended-hours trade · regular close ${fmtPrice(s.regular_price)}"` : ""}>${fmtPrice(s.price)}</td>
      <td class="${signClass(s.pct_from_open)}">${fmtPct(s.pct_from_open)}</td>
      <td class="${signClass(s.pct_from_close)}">${fmtPct(s.pct_from_close)}</td>
      <td>${fmtVolume(s.volume)}</td>
      <td class="${s.rvol != null && s.rvol >= hotRvol ? "hot" : ""}">${fmtRatio(s.rvol)}</td>
      <td class="${s.rvol_pace != null && s.rvol_pace >= hotRvol ? "hot" : ""}">${fmtRatio(s.rvol_pace)}</td>
    </tr>`).join("");
}

function fmtLeft(seconds) {
  const d = Math.floor(seconds / 86400), h = Math.floor((seconds % 86400) / 3600), m = Math.floor((seconds % 3600) / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}

function renderToken(token) {
  const badge = $("token"), banner = $("token-banner");
  if (!token) { badge.style.display = "none"; banner.className = ""; return; }
  const left = token.seconds_left;
  const expires = token.expires_at ? new Date(token.expires_at).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
  const relogin = "Run <code>python backend.py login</code> to renew.";
  badge.style.display = "";
  badge.className = "badge token-" + token.level;
  badge.title = token.expires_at ? "Schwab refresh token expires " + expires : "";
  badge.textContent = {
    ok: `Token ${fmtLeft(left)}`,
    warning: `Token expires in ${fmtLeft(left)}`,
    urgent: `Token expires in ${fmtLeft(left)}`,
    expired: "Token expired",
    missing: "No token",
  }[token.level];
  banner.className = token.level === "ok" ? "" : token.level;
  banner.innerHTML = {
    ok: "",
    warning: `Schwab login expires in ${fmtLeft(left)} (${expires}). ${relogin}`,
    urgent: `⚠ Schwab login expires in ${fmtLeft(left)} (${expires}) — quotes will stop. ${relogin}`,
    expired: `⚠ Schwab login expired ${expires}. Quotes have stopped. ${relogin}`,
    missing: `⚠ No Schwab token found. ${relogin}`,
  }[token.level];
}

function renderStatus() {
  const { meta } = state.data;
  $("mode").textContent = meta.mode === "demo" ? "DEMO DATA" : "SCHWAB";
  $("mode").className = "badge" + (meta.mode === "demo" ? " demo" : "");
  const session = meta.session || (meta.market_open ? "regular" : "closed");
  const every = meta.poll_seconds >= 60 ? `every ${Math.round(meta.poll_seconds / 60)} min` : `every ${meta.poll_seconds}s`;
  $("market").textContent = `${SESSION_LABELS[session]} · ${every}`;
  $("market").className = "badge" + (session === "regular" ? " open" : session === "closed" ? "" : " ext");
  renderToken(meta.token);
  const at = meta.quotes_at ? new Date(meta.quotes_at).toLocaleTimeString() : "—";
  $("status").textContent = `Quotes ${at} · topd: ≥${meta.thresholds.topd_min_pct_from_open}% from open & RVOL ≥${meta.thresholds.topd_min_rvol}`;
  const errors = Object.values(meta.errors || {});
  $("errors").textContent = errors.length ? errors.slice(0, 3).join(" · ") + (errors.length > 3 ? ` (+${errors.length - 3} more)` : "") : "";
}

async function loadScreener() {
  const res = await fetch("/api/screener-data", { cache: "no-store" });
  if (!res.ok) throw new Error(res.status);
  state.data = await res.json();
  renderScans(state.data.summary);
  renderHead();
  renderTable();
  renderStatus();
  updateLiveBar();
  if (!state.selected && state.data.stocks.length) {
    state.selected = sortedStocks(visibleStocks(state.data.stocks))[0].symbol;
    renderTable();
    loadChart(state.selected);
  }
}

async function poll() {
  try {
    await loadScreener();
  } catch (err) {
    $("status").textContent = "Backend unreachable — retrying";
  } finally {
    setTimeout(poll, POLL_MS);
  }
}

async function postUniverse(url, body, noteId) {
  const note = $(noteId);
  note.textContent = "Saving…";
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      note.textContent = typeof data.detail === "string" ? data.detail : "Could not update the watchlist";
      return false;
    }
    note.textContent = data.count + (data.count === 1 ? " ticker" : " tickers");
    await loadScreener();
    return true;
  } catch (err) {
    note.textContent = "Could not update the watchlist";
    return false;
  }
}

async function sendWatchlist(mode) {
  const file = $("watchlist-file").files[0];
  if (!file) {
    $("watchlist-note").textContent = "Choose a txt or csv file";
    return;
  }
  const text = await file.text();
  await postUniverse("/api/universe", { mode, text }, "watchlist-note");
}
$("watchlist-replace").addEventListener("click", () => sendWatchlist("replace"));
$("watchlist-merge").addEventListener("click", () => sendWatchlist("merge"));
$("watchlist-file").addEventListener("change", () => {
  const file = $("watchlist-file").files[0];
  $("watchlist-note").textContent = file ? file.name : "";
});
$("add-ticker").addEventListener("submit", async (event) => {
  event.preventDefault();
  const symbol = $("add-symbol").value.trim();
  if (!symbol) return;
  if (await postUniverse("/api/universe/symbol", { symbol }, "add-note")) $("add-symbol").value = "";
});

$("head").addEventListener("click", (e) => {
  const th = e.target.closest("th");
  if (!th) return;
  const key = th.dataset.key;
  state.sort = state.sort.key === key
    ? { key, dir: state.sort.dir === "desc" ? "asc" : "desc" }
    : { key, dir: "desc" };
  localStorage.setItem("screener.sort", JSON.stringify(state.sort));
  renderHead();
  if (state.data) renderTable();
});

$("scan-rows").addEventListener("click", (e) => {
  const row = e.target.closest("button.scan");
  if (!row) return;
  setScan(row.dataset.scan || null);
});
$("scan-clear").addEventListener("click", () => setScan(null));

$("rows").addEventListener("click", (e) => {
  const tr = e.target.closest("tr");
  if (!tr) return;
  state.selected = tr.dataset.symbol;
  localStorage.setItem("screener.symbol", state.selected);
  renderTable();
  loadChart(state.selected);
});

/* Section C: chart */
const chart = LightweightCharts.createChart($("chart"), {
  autoSize: true,
  rightPriceScale: { scaleMargins: { top: 0.06, bottom: 0.26 } },
  timeScale: { rightOffset: 8 },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
});
const candleSeries = chart.addCandlestickSeries({
  upColor: "#26a69a", downColor: "#ef5350", borderUpColor: "#26a69a", borderDownColor: "#ef5350",
  wickUpColor: "#26a69a", wickDownColor: "#ef5350",
});
const volumeSeries = chart.addHistogramSeries({ priceScaleId: "vol", priceFormat: { type: "volume" }, lastValueVisible: false, priceLineVisible: false });
chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.78, bottom: 0 } });
const lineOpts = (color) => ({ color, lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
const maSeries = state.mas.map((item) => chart.addLineSeries(lineOpts(item.color)));

function smaValues(values, length) {
  const out = new Array(values.length).fill(null);
  let running = 0;
  for (let i = 0; i < values.length; i++) {
    running += values[i];
    if (i >= length) running -= values[i - length];
    if (i >= length - 1) out[i] = running / length;
  }
  return out;
}

function emaValues(values, length) {
  const out = new Array(values.length).fill(null);
  if (values.length < length) return out;
  const alpha = 2 / (length + 1);
  let current = values.slice(0, length).reduce((sum, value) => sum + value, 0) / length;
  out[length - 1] = current;
  for (let i = length; i < values.length; i++) {
    current = values[i] * alpha + current * (1 - alpha);
    out[i] = current;
  }
  return out;
}

function maLine(bars, spec) {
  if (!spec.visible) return [];
  const closes = bars.map((bar) => bar.close);
  const values = spec.type === "SMA" ? smaValues(closes, spec.period) : emaValues(closes, spec.period);
  return bars.flatMap((bar, index) => (values[index] == null ? [] : [{ time: bar.time, value: Math.round(values[index] * 10000) / 10000 }]));
}

function candleColors() {
  if (state.bw && state.theme === "dark") {
    return { upColor: "#121212", downColor: "#ffffff", borderUpColor: "#ffffff", borderDownColor: "#ffffff", wickUpColor: "#ffffff", wickDownColor: "#ffffff" };
  }
  if (state.bw) {
    return { upColor: "#ffffff", downColor: "#000000", borderUpColor: "#000000", borderDownColor: "#000000", wickUpColor: "#000000", wickDownColor: "#000000" };
  }
  return { upColor: "#26a69a", downColor: "#ef5350", borderUpColor: "#26a69a", borderDownColor: "#ef5350", wickUpColor: "#26a69a", wickDownColor: "#ef5350" };
}

function volumeColor(up) {
  if (state.bw && state.theme === "dark") return up ? "#8a8a8a" : "#f5f5f5";
  if (state.bw) return up ? "#c8c8c8" : "#111111";
  return (up ? "#26a69a" : "#ef5350") + "80";
}

function paintChart() {
  candleSeries.applyOptions(candleColors());
  if (!state.chartBars) return;
  const byTime = new Map(state.chartBars.map((bar) => [bar.time, bar]));
  volumeSeries.setData((state.chartVolume || []).map((bar) => {
    const candle = byTime.get(bar.time);
    const up = candle ? candle.close >= candle.open : true;
    return { time: bar.time, value: bar.value, color: volumeColor(up) };
  }));
  state.mas.forEach((spec, index) => {
    maSeries[index].applyOptions({ color: spec.color, visible: spec.visible });
    maSeries[index].setData(maLine(state.chartBars, spec));
  });
}

function saveMas() {
  localStorage.setItem("screener.mas", JSON.stringify(state.mas.map(({ period, type, visible }) => ({ period, type, visible }))));
}

function renderLegend() {
  $("legend").innerHTML = state.mas.map((spec, index) => `
    <span class="ma${spec.visible ? "" : " off"}" data-ma="${index}">
      <button type="button" class="ma-vis" style="color:${spec.color}" title="Show or hide" aria-pressed="${spec.visible}"><i></i></button>
      <input class="ma-period" type="number" min="1" max="500" step="1" value="${spec.period}" aria-label="Moving average period">
      <button type="button" class="ma-type" title="Switch EMA or SMA">${spec.type}</button>
    </span>`).join("");
}

function applyTheme() {
  const t = THEMES[state.theme];
  chart.applyOptions({
    layout: { background: { type: "solid", color: t.background }, textColor: t.text },
    grid: { vertLines: { color: t.grid }, horzLines: { color: t.grid } },
    rightPriceScale: { borderColor: t.border },
    timeScale: { borderColor: t.border },
  });
  $("theme").textContent = state.theme === "light" ? "Dark mode" : "Light mode";
  $("bw").setAttribute("aria-pressed", String(state.bw));
  paintChart();
}
$("theme").addEventListener("click", () => {
  state.theme = state.theme === "light" ? "dark" : "light";
  localStorage.setItem("screener.theme", state.theme);
  applyTheme();
});
$("bw").addEventListener("click", () => {
  state.bw = !state.bw;
  localStorage.setItem("screener.bw", state.bw ? "1" : "0");
  applyTheme();
});
$("legend").addEventListener("click", (event) => {
  const chip = event.target.closest("[data-ma]");
  if (!chip) return;
  const spec = state.mas[Number(chip.dataset.ma)];
  if (event.target.closest(".ma-vis")) spec.visible = !spec.visible;
  else if (event.target.closest(".ma-type")) spec.type = spec.type === "EMA" ? "SMA" : "EMA";
  else return;
  saveMas();
  renderLegend();
  paintChart();
});
$("legend").addEventListener("change", (event) => {
  const input = event.target.closest(".ma-period");
  if (!input) return;
  const spec = state.mas[Number(input.closest("[data-ma]").dataset.ma)];
  const period = Number(input.value);
  if (!Number.isInteger(period) || period < 1 || period > 500) {
    input.value = spec.period;
    return;
  }
  spec.period = period;
  saveMas();
  paintChart();
});
renderLegend();
applyTheme();

let chartRequest = 0;
async function loadChart(symbol) {
  const request = ++chartRequest;
  $("chart-symbol").textContent = symbol;
  $("chart-msg").textContent = "Loading " + symbol + "…";
  try {
    const res = await fetch("/api/candles?symbol=" + encodeURIComponent(symbol));
    if (!res.ok) throw new Error((await res.json()).detail || res.status);
    const data = await res.json();
    if (request !== chartRequest) return;
    state.chartBars = data.candles;
    state.chartVolume = data.volume;
    candleSeries.setData(data.candles);
    paintChart();
    const n = data.candles.length;
    chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - 130), to: n + 8 });
    $("chart-msg").textContent = "";
  } catch (err) {
    if (request === chartRequest) $("chart-msg").textContent = `Chart unavailable: ${err.message}`;
  }
}

function updateLiveBar() {
  const bars = state.chartBars;
  if (!bars || !bars.length || !state.data) return;
  const last = bars[bars.length - 1];
  if (last.time !== state.data.meta.session_date) return;
  const s = state.data.stocks.find((x) => x.symbol === $("chart-symbol").textContent);
  const price = s ? s.regular_price ?? s.price : null;
  if (price == null || s.open == null) return;
  const bar = {
    time: last.time, open: s.open, close: price,
    high: Math.max(s.high ?? price, s.open, price), low: Math.min(s.low ?? price, s.open, price),
  };
  bars[bars.length - 1] = bar;
  const volume = (state.chartVolume || []).find((item) => item.time === bar.time);
  if (volume) volume.value = s.volume || 0;
  candleSeries.update(bar);
  paintChart();
}

chart.subscribeCrosshairMove((param) => {
  const bar = param.seriesData && param.seriesData.get(candleSeries);
  $("ohlc").textContent = bar ? `O ${bar.open.toFixed(2)}  H ${bar.high.toFixed(2)}  L ${bar.low.toFixed(2)}  C ${bar.close.toFixed(2)}` : "";
});

if (state.selected) loadChart(state.selected);
poll();
</script>
</body>
</html>
